name: Atualizar perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: true

jobs:
  gerar-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check Pillow==10.4.0

      - name: Gerar retrato, painel e gráfico
        env:
          GITHUB_PROFILE_USER: Flpvoigt
        run: python scripts/generate_profile_assets.py

      - name: Publicar atualização quando houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap-v2.svg assets/felipe-ascii-v2.svg assets/info-card-v2.svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no perfil."
          else
            git commit -m "chore: atualiza gráfico de contribuições [skip ci]"
            git push
          fi
